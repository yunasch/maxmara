apiVersion: v1
kind: Service
metadata:
  name: odoo
spec:
  selector:
    app: odoo
  ports:
    - name: http
      port: {{ .Values.odoo.service.port }}
      targetPort: 8069
    - name: longpoll
      port: {{ .Values.odoo.service.longpollPort }}
      targetPort: 8072
  type: {{ .Values.odoo.service.type }}